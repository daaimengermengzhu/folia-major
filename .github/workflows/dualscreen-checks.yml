name: DualScreen Windows checks

on:
  push:
    branches: [community/windows-dual-display]
  pull_request:
    branches: [community/windows-dual-display]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dualscreen-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint:install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run dedicatus
      - run: npm run test:unit -- test/unit/electron/autoDisplay test/unit/electron/windowsWallpaper test/unit/electron/wallpaperDisplay.test.ts test/unit/electron/updateChannels.test.ts
      - run: cargo test --manifest-path packaging/windows/wallpaper-helper/Cargo.toml
